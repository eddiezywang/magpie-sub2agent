<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sub2Agent · 工作台预览</title><link rel="stylesheet" href="../internal/gui/assets/intranet-retro.css"><style>
*{box-sizing:border-box}body{margin:0;color:var(--fg);font:13px/1.5 "Microsoft YaHei",system-ui,sans-serif}button,a,summary,select{-webkit-tap-highlight-color:transparent}button{font:inherit}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}::selection{background:var(--sel)}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.side{background:var(--card);border-right:2px solid var(--retro-ink);padding:18px 12px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:700;margin:0 4px 26px}.brand img{width:30px;height:30px;image-rendering:pixelated}.nav-label{font-size:11px;color:var(--muted);margin:16px 8px 8px}.nav{display:grid;gap:4px}.nav a{padding:8px 12px;border-radius:4px;display:flex;gap:10px;align-items:center}.nav svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5}.nav a.active{background:var(--accent-soft);box-shadow:var(--seg-edge);font-weight:650}.side-bottom{border-top:1px dashed var(--line);padding:14px 8px 0;margin-top:auto;font-size:11px;color:var(--muted)}.side-bottom i{display:inline-block;width:6px;height:6px;background:#169365;border-radius:50%;margin-right:6px}.main{min-width:0}.top{height:52px;display:flex;align-items:center;padding:0 24px;gap:14px;background:var(--card);border-bottom:2px solid var(--retro-ink)}.crumb{color:var(--muted)}.crumb b{color:var(--fg);font-size:15px}.preview{margin-left:auto;font-size:11px;color:var(--muted)}.content{max-width:1580px;margin:auto;padding:30px 36px 50px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px}.workspace>div,.rail{min-width:0}h2{font-size:13px;margin:0;font-weight:650}.section-heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.section-heading a{font-size:12px;color:var(--muted)}iframe{display:block;width:100%;border:0;background:transparent}.rail{border-left:1px solid var(--line-2);padding-left:22px}#agent-disclosure{margin-bottom:24px}#agent-disclosure summary{display:flex;align-items:center;gap:16px;cursor:pointer;list-style:none;border-bottom:1px solid var(--line-2);padding:10px 0 12px}#agent-disclosure summary::-webkit-details-marker{display:none}.agent-title{font-weight:650}.counts{color:var(--muted);font-size:12px}.counts b{font-weight:500;color:var(--fg)}.disclosure-action{margin-left:auto;color:var(--muted);display:flex;align-items:center;gap:6px;font-size:12px}.disclosure-action svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;transition:transform .15s}details[open] .disclosure-action svg{transform:rotate(180deg)}details[open] summary{margin-bottom:12px}.manage-link{font-size:12px;color:var(--muted)}#group-management[hidden],#workspace[hidden]{display:none}@media(max-width:1150px){.workspace{grid-template-columns:minmax(0,1fr) 300px;gap:18px}.content{padding:24px}.rail{padding-left:14px}.shell{grid-template-columns:180px minmax(0,1fr)}}@media(max-width:900px){.workspace{grid-template-columns:1fr}.rail{border-left:0;border-top:1px solid var(--line);padding:20px 0 0}}@media(max-width:640px){.shell{display:block}.side{display:none}.content{padding:18px 12px}.top{padding:0 14px}.counts{font-size:11px}#agent-disclosure summary{gap:10px}}
</style></head><body><div class="shell"><aside class="side"><a class="brand" href="routing-workspace.html"><img src="../build/intranet/pixel-icons/sub2agent.svg" alt="">Sub2Agent</a><div class="nav-label">使用</div><nav class="nav"><a class="active" href="routing-workspace.html" data-nav="home"><svg viewBox="0 0 20 20"><path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z"/></svg>工作台</a><a href="native-surface.html?view=agents"><svg viewBox="0 0 20 20"><path d="m4 5 5 5-5 5m7 0h5"/></svg>Agent</a><a href="native-surface.html?view=sessions"><svg viewBox="0 0 20 20"><path d="M3 4h14v10H8l-5 3z"/></svg>会话</a></nav><div class="nav-label">模型</div><nav class="nav"><a href="native-surface.html?view=providers"><svg viewBox="0 0 20 20"><circle cx="6" cy="9" r="3"/><path d="M9 9h8m-3 0v4m3-4v3"/></svg>供应商</a><a href="routing-workspace.html?view=groups" data-nav="groups"><svg viewBox="0 0 20 20"><path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z"/></svg>路由组</a></nav><div class="side-bottom"><i></i>网关运行中 · 模拟数据</div></aside><main class="main"><header class="top"><span class="crumb">使用 / <b id="page-name">工作台</b></span><span class="preview">交互预览 · 示例数据</span></header><div class="content"><div class="workspace" id="workspace"><div><details id="agent-disclosure"><summary><span class="agent-title">Agent 接入</span><span class="counts" id="agent-summary"><b>已接入 2</b> · 未接入 8</span><span class="disclosure-action"><span id="agent-action-label">查看全部</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></span></summary><iframe id="agent-native" title="Agent 接入与模型配置" src="native-surface.html?view=agents" style="height:760px"></iframe></details><section><div class="section-heading"><h2>路由策略</h2></div><iframe id="routing-visual" title="路由策略与吞吐量" src="native-surface.html?view=routing" style="height:600px"></iframe></section></div><aside class="rail"><div class="section-heading"><h2>供应商</h2><a href="native-surface.html?view=providers">管理 ›</a></div><iframe id="provider-native" title="供应商管理" src="native-surface.html?view=providers" style="height:600px"></iframe></aside></div><section id="group-management" hidden><div class="section-heading"><h2>路由组</h2><a href="routing-workspace.html">返回工作台 ›</a></div><iframe id="groups-native" title="路由组管理" style="height:800px"></iframe></section></div></main></div><script>
const agentDetails=document.querySelector('#agent-disclosure');agentDetails.addEventListener('toggle',()=>document.querySelector('#agent-action-label').textContent=agentDetails.open?'收起':'查看全部');window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='native-height'){const ids={agents:'agent-native',providers:'provider-native',routing:'routing-visual',groups:'groups-native'};const frame=document.getElementById(ids[e.data.surface]);if(frame&&frame.contentWindow===e.source)frame.style.height=Math.max(120,Math.min(6000,e.data.height))+'px'}if(e.data?.type==='agent-counts'&&e.source===document.querySelector('#agent-native').contentWindow){const label=document.querySelector('#agent-summary');label.textContent='已接入 '+e.data.connected+' · 未接入 '+(e.data.total-e.data.connected)}});if(new URLSearchParams(location.search).get('view')==='groups'){document.querySelector('#workspace').hidden=true;document.querySelector('#group-management').hidden=false;document.querySelector('#groups-native').src='native-surface.html?view=groups';document.querySelector('#page-name').textContent='路由组';document.querySelector('[data-nav=home]').classList.remove('active');document.querySelector('[data-nav=groups]').classList.add('active')}
</script></body></html>

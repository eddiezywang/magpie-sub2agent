<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIG 配置审查 · 真实界面底稿</title><style>body{margin:0;background:#ebe7dd;color:#28221d;font:14px/1.5 "Microsoft YaHei",sans-serif}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fffcf6;border-bottom:1px solid #b7a995;padding:10px 16px;position:sticky;top:0;z-index:2}.toolbar strong{margin-right:8px}.toolbar button{background:transparent;border:1px solid #c6b8a6;border-radius:3px;padding:6px 10px;cursor:pointer;color:#25211c}.toolbar button.on{background:#315af2;color:white;border-color:#222;box-shadow:2px 2px 0 #222}.meta{margin-left:auto;font-size:12px;color:#6b6054}.canvas{max-width:1440px;margin:12px auto;position:relative;box-shadow:0 2px 10px #b6aa9b}.canvas img{display:block;width:100%;height:auto}.hotspot{position:absolute;left:23.5%;top:60.1%;width:22%;height:3%;border:0;background:transparent;cursor:pointer}.hotspot:focus-visible{outline:2px solid #315af2}.note{max-width:1440px;margin:8px auto 16px;color:#746657;font-size:12px;padding:0 12px}@media(max-width:680px){.meta{width:100%;margin:0}.canvas{margin:0}.toolbar{position:static}}</style></head><body><div class="toolbar"><strong>真实界面底稿 · 审查</strong><button data-screen="config" class="on">添加 TIG</button><button data-screen="config-expanded">展开系数</button><button data-screen="detected">识别成功</button><button data-screen="usage">用量 · 概览</button><span class="meta">真实应用页面 + 演示数据；不连接账户</span></div><div class="canvas"><img id="screen" src="tig-review-real/config.png" alt="TIG 供应商弹窗，含套餐与积分规则演示"><button id="expand" class="hotspot" title="展开模型系数" aria-label="展开模型系数"></button></div><p class="note" id="note">这是基于真实应用界面截取的审查稿。点击上方可切换状态；截图中“查看各模型积分系数”也可点击。数据仅为演示，不代表真实余额。</p><script>const image=document.querySelector('#screen'),hot=document.querySelector('#expand'),buttons=[...document.querySelectorAll('[data-screen]')];function show(name){image.src='tig-review-real/'+name+'.png';image.alt=({config:'真实 TIG 添加弹窗及套餐总览', 'config-expanded':'真实 TIG 弹窗与展开的模型积分系数', detected:'识别成功后展示可能可用的套餐线路',usage:'真实应用用量概览中的套餐统计'})[name];hot.hidden=name!=='config';buttons.forEach(b=>b.classList.toggle('on',b.dataset.screen===name));document.querySelector('#note').textContent=name==='usage'?'用量放在现有“用量 → 概览”；按用户名汇总的滚动用量是估算，并非某个 Key 的真实剩余额度。':'这是基于真实应用界面截取的审查稿，使用演示数据；未连接账户，也未改变应用。'}buttons.forEach(b=>b.onclick=()=>show(b.dataset.screen));hot.onclick=()=>show('config-expanded');</script></body></html>

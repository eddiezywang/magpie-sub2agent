events { worker_connections 128; }
http {
  access_log off;
  client_max_body_size 16m;
  server {
    listen 8897 ssl;
    server_name 124.220.199.224;
    ssl_certificate /etc/bi-tls/server.crt;
    ssl_certificate_key /etc/bi-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /api/bi-snapshot {
      limit_except POST { deny all; }
      proxy_read_timeout 75s;
      proxy_pass http://127.0.0.1:18898;
    }
    location = /api/snapshot {
      limit_except POST { deny all; }
      proxy_pass http://127.0.0.1:18899;
    }
    location = /overview { return 308 /overview/; }
    location /overview/ {
      proxy_pass http://127.0.0.1:18899/;
    }
    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://127.0.0.1:18897;
    }
  }
}

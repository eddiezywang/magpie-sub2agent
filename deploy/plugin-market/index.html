<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sub2Agent 内网插件广场</title><style>body{font:15px/1.7 system-ui;background:#f7f8fa;color:#20242b;margin:8vh auto;padding:0 24px;max-width:760px}h1{font-size:28px;letter-spacing:-.04em}a{color:#5046df}code{background:#eceef2;padding:3px 6px;border-radius:4px}p{color:#555e6d}li{margin:12px 0}</style><h1>Sub2Agent 内网插件广场</h1><p>为内网客户端提供插件目录、版本元数据和完整离线安装包。</p><ul><li><a href="/healthz">检查服务状态</a></li><li><a href="/magpie/plugins/registry.json">查看插件目录</a></li></ul><p>请在 Sub2Agent 的「插件 → 发现」中浏览和安装。尚未发布插件时，客户端会明确显示目录为空；断网时保留缓存与本地导入。</p><p>管理员使用服务器上的 <code>/opt/sub2agent-plugin-market/bin/publish.py</code> 发布已打包的插件。此服务不代理公网 npm，也不在线编译插件。</p></html>
